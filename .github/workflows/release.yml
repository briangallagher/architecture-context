name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: arch-query-linux-amd64
          - goos: linux
            goarch: arm64
            name: arch-query-linux-arm64
          - goos: darwin
            goarch: amd64
            name: arch-query-darwin-amd64
          - goos: darwin
            goarch: arm64
            name: arch-query-darwin-arm64

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/arch-query/go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Stage embedded data
        working-directory: src/arch-query
        run: |
          rm -rf _embedded/architecture
          mkdir -p _embedded/architecture
          go run ./internal/embeddeddata/cmd \
            -source ../../architecture \
            -destination _embedded/architecture \
            -overlays ../../overlays

      - name: Build
        working-directory: src/arch-query
        run: go build -tags embedded -o ../../${{ matrix.name }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
